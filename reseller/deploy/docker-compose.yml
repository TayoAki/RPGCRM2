# One isolated CRM instance: app server, background worker, Postgres, Redis and
# Caddy (automatic HTTPS for DOMAIN). Run one copy per customer:
#   docker compose --env-file instances/<name>/.env -p <name> up -d
# See reseller/docs/OPERATIONS.md.

x-app-environment: &app-environment
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME:-default}
  SERVER_URL: https://${DOMAIN}
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}

  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}

  BRAND_NAME: ${BRAND_NAME:-RPG CRM}
  BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
  BRAND_WEBSITE_URL: ${BRAND_WEBSITE_URL:-}
  BRAND_SUPPORT_URL: ${BRAND_SUPPORT_URL:-}
  BRAND_DOCUMENTATION_URL: ${BRAND_DOCUMENTATION_URL:-}
  BRAND_TERMS_OF_SERVICE_URL: ${BRAND_TERMS_OF_SERVICE_URL:-}
  BRAND_PRIVACY_POLICY_URL: ${BRAND_PRIVACY_POLICY_URL:-}
  BRAND_LEGAL_ENTITY: ${BRAND_LEGAL_ENTITY:-}
  SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}

  EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RPG CRM}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

  AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
  AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
  AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
  AUTH_GOOGLE_CALLBACK_URL: https://${DOMAIN}/auth/google/redirect
  AUTH_GOOGLE_APIS_CALLBACK_URL: https://${DOMAIN}/auth/google-apis/get-access-token
  MESSAGING_PROVIDER_GMAIL_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
  CALENDAR_PROVIDER_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}

  AUTH_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-false}
  AUTH_MICROSOFT_CLIENT_ID: ${AUTH_MICROSOFT_CLIENT_ID:-}
  AUTH_MICROSOFT_CLIENT_SECRET: ${AUTH_MICROSOFT_CLIENT_SECRET:-}
  AUTH_MICROSOFT_CALLBACK_URL: https://${DOMAIN}/auth/microsoft/redirect
  AUTH_MICROSOFT_APIS_CALLBACK_URL: https://${DOMAIN}/auth/microsoft-apis/get-access-token
  MESSAGING_PROVIDER_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-false}
  CALENDAR_PROVIDER_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-false}

  IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
  TELEMETRY_ENABLED: "false"

x-app-image: &app-image ${IMAGE:-ghcr.io/tayoaki/rpgcrm2}:${TAG:-latest}

services:
  server:
    image: *app-image
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      <<: *app-environment
      NODE_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  worker:
    image: *app-image
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      <<: *app-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  db-data:
  server-local-data:
  caddy-data:
